name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Latin font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation2
      - name: Prepare CJK test font
        run: python scripts/ci_fonts.py --directory "${{ runner.temp }}/xhs-ci-fonts"
      - name: Install project and build tools
        run: python -m pip install ".[dev]"
      - name: Audit the public source and Git index
        run: python scripts/audit_public.py --check-git
      - name: Test workflow
        run: python -m unittest discover -s pipeline/v2/tests
      - name: Test public distribution boundaries
        run: python -m unittest discover -s tests
      - name: Build and check Python artifacts
        run: |
          python -m build
          python -m twine check dist/*
      - name: Exercise installed commands
        run: |
          xhs-pipeline --version
          xhs-materials --doctor
          xhs-materials --input examples/content.json --output-dir "${{ runner.temp }}/xhs-materials-demo"
      - name: Export audited public source
        run: python scripts/export_public.py --output "${{ runner.temp }}/xhs-public-source.zip"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare pinned backend source
        run: python integrations/xiaohongshu-mcp/setup_source.py --destination "${{ runner.temp }}/xhs-mcp-source"
      - name: Run selected offline backend tests
        working-directory: ${{ runner.temp }}/xhs-mcp-source
        run: |
          go test -mod=readonly ./... -run '^TestIntegration' -count=1
          go test -mod=readonly github.com/xpzouying/headless_browser -run '^TestNativeChrome' -count=1
