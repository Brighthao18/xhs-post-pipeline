[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-post-pipeline"
version = "2.1.0"
description = "Local, auditable article-to-Xiaohongshu material and publication workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=12.0.0,<13"]
keywords = ["xiaohongshu", "content-workflow", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["build>=1.2.2,<2", "twine>=6,<7"]

[project.scripts]
xhs-pipeline = "pipeline.v2.__main__:main"
xhs-materials = "pipeline.assets.scripts.generate:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.v2", "pipeline.assets", "pipeline.assets.scripts"]
include-package-data = false
